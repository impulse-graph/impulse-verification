# Impulse Graph Engine — Canonical Verification & Test Catalog
# Single source of truth for all test suites, fuzzers, sanitizers, coverage gates,
# soak harnesses, benchmarks, and post-release checks across the ecosystem.

[meta]
schema_version = 1
default_gamut = "standard"
default_seed = 20261122

[repos]
spec = "impulse-graph-spec"
core = "impulse-graph-core"
java = "impulse-graph-java"
ocaml = "impulse-ocaml"
verification = "impulse-verification"
benchmarks = "impulse-benchmarks"
website = "impulse-website"

# ---------------------------------------------------------------------------
# Orthogonal Guarantee Pillars
# ---------------------------------------------------------------------------
[pillars.lint]
description = "Static architectural invariants, ISA freeze/codegen drift, formatting, and SIMD codegen audits"

[pillars.unit]
description = "Per-repository unit, component, CLI, and language FFI binding test suites"

[pillars.parity]
description = "4-way polyglot spec compliance, cross-compiler parity, SIMD equivalence, and snapshot round-trip"

[pillars.contracts]
description = "Zero-allocation determinism, heap ceiling, topology fail-fast, and malicious input hardening"

[pillars.metamorphic]
description = "Algebraic, graph-semiring law, and metamorphic 4-way property verification"

[pillars.fuzz]
description = "Differential, contract-guided, corpus-mutation, OOM, 3VL, morsel, and PowerGrid fuzzers"

[pillars.sanitize]
description = "ASan/UBSan, TSan, LLVM MC/DC branch coverage, JaCoCo, and Pitest mutation analysis"

[pillars.stress]
description = "High-volume morsel/shader stress and sustained memory/RSS leak soak harnesses"

[pillars.perf]
description = "Micro/macro performance benchmarks and Java <= 2x C++ parity regression gates"

[pillars.release-e2e]
description = "CMake SDK install surface, live registry checks, and website/doc snippet verification"

# ---------------------------------------------------------------------------
# Named Gamuts (Ordered Assurance Ladder)
# ---------------------------------------------------------------------------
[gamuts.veryquick]
description = "Fast deterministic edit-loop sanity (~30s, zero fuzzing)"
target_time_sec = 30
intensity = "quick"
suites = [
  "lint.engine_invariants",
  "lint.spec_isa_m0",
  "unit.verification.framework",
  "unit.ocaml.dune",
  "unit.cpp.ctest",
  "parity.four_way_spec",
]

[gamuts.standard]
description = "Canonical 'run all the tests' (~3-5m): all deterministic unit/parity/contract suites + bounded-seed metamorphic & differential fuzzing"
target_time_sec = 300
intensity = "standard"
extends = ["veryquick"]
suites = [
  "lint.simd_codegen",
  "unit.rust.engine",
  "unit.rust.cli",
  "unit.java.all",
  "parity.cross_compiler",
  "parity.simd_equivalence",
  "parity.storage_coverage",
  "parity.seeded_roundtrip_50",
  "contracts.topology_failfast",
  "contracts.zero_alloc_determinism",
  "contracts.memory_ceiling",
  "metamorphic.vm_laws",
  "metamorphic.graph_algebra",
  "fuzz.vm_contracts",
  "fuzz.multihop_morsels",
  "fuzz.mitra_multilane",
  "fuzz.ieee754_3vl",
  "fuzz.memory_planner_oom",
  "fuzz.snapshot_morsels",
]

[gamuts.hardened]
description = "Pre-merge safety sign-off (~10-20m): standard + FFI bindings + C++ ASan/UBSan + TSan + LLVM MC/DC + corpus mutation"
target_time_sec = 1200
intensity = "standard"
extends = ["standard"]
suites = [
  "unit.ffi.python",
  "unit.ffi.go",
  "unit.ffi.node",
  "unit.ffi.dotnet",
  "sanitize.cpp.asan_ubsan",
  "sanitize.cpp.tsan",
  "sanitize.cpp.mcdc",
  "sanitize.java.jacoco",
  "fuzz.corpus_mutator",
  "fuzz.powergrid_queries",
  "stress.morsel_shaders",
]

[gamuts.full-gamut]
description = "Pre-release sign-off (docs/RELEASE_CHECKLIST.md): hardened at deep 20k+ fuzz budgets + SDK install + perf regression gate"
target_time_sec = 3600
intensity = "deep"
extends = ["hardened"]
suites = [
  "release.cmake_sdk_install",
  "perf.benchmarks_quick",
]

[gamuts.soak]
description = "Overnight / endurance verification: high-iteration fuzzing, corpus mutation, morsel stress, and Pitest mutation testing"
target_time_sec = 14400
intensity = "soak"
suites = [
  "fuzz.vm_contracts",
  "fuzz.corpus_mutator",
  "fuzz.multihop_morsels",
  "fuzz.mitra_multilane",
  "fuzz.ieee754_3vl",
  "fuzz.memory_planner_oom",
  "fuzz.snapshot_morsels",
  "stress.morsel_shaders",
  "sanitize.java.pitest",
]

[gamuts.bench]
description = "Dedicated performance benchmark suite (impulse-benchmarks); excluded from default correctness runs"
target_time_sec = 600
intensity = "standard"
suites = [
  "perf.benchmarks_quick",
  "perf.benchmarks_medium",
  "perf.qlever",
  "perf.financial_ledger",
]

[gamuts.post-release]
description = "Post-publish verification: website strict MkDocs build and live registry checks"
target_time_sec = 300
intensity = "standard"
suites = [
  "release.website_mkdocs_strict",
]

# ---------------------------------------------------------------------------
# Declarative Prerequisites
# ---------------------------------------------------------------------------
[prereqs.build_on]
kind = "library"
description = "C++ core library (optimizations ON)"
hint = "cmake --build impulse-graph-core/impulse-cpp/build_on --target impulse_graph -j"

[prereqs.build_off]
kind = "library"
description = "C++ core library (optimizations OFF)"
hint = "cmake --build impulse-graph-core/impulse-cpp/build_off --target impulse_graph -j"

[prereqs.java25]
kind = "command"
command = "mvn"
description = "Maven + JDK 21/25 toolchain"
hint = "Install Maven and JDK 25 (JAVA_HOME)"

[prereqs.ocaml]
kind = "command"
command = "dune"
description = "OCaml Dune toolchain"
hint = "opam exec -- dune build (in impulse-ocaml)"

[prereqs.cargo]
kind = "command"
command = "cargo"
description = "Rust Cargo toolchain"
hint = "Install Rust via rustup"

[prereqs.cmake]
kind = "command"
command = "cmake"
description = "CMake build system"
hint = "brew install cmake"

[prereqs.go]
kind = "command"
command = "go"
description = "Go toolchain for impulse-go"
hint = "brew install go"

[prereqs.node]
kind = "command"
command = "npm"
description = "Node.js / npm for impulse-node"
hint = "brew install node"

[prereqs.dotnet]
kind = "command"
command = "dotnet"
description = ".NET SDK for impulse-dotnet"
hint = "brew install --cask dotnet-sdk"

[prereqs.pytest]
kind = "python_module"
module = "pytest"
description = "pytest for impulse-python"
hint = "python3 -m pip install pytest"

[prereqs.docker]
kind = "command"
command = "docker"
description = "Docker CLI for MkDocs / doc snippet verification"
hint = "Install Docker Desktop or OrbStack"

[prereqs.impulse_cli]
kind = "binary"
description = "impulse-graph CLI binary (for .imps builds & validation)"
hint = "cargo build --release --manifest-path impulse-graph-core/impulse-cli/Cargo.toml"

[prereqs.impulse_python]
kind = "python_binding"
description = "impulse_graph native Python binding (for .imps queries)"
hint = "cd impulse-graph-core/impulse-python && python3 setup.py build_ext --inplace"

[prereqs.powergrid_fixture]
kind = "path"
path = "{verification}/datasets/powergrid_fixture/case1354pegase"
description = "Generated PowerGrid verification fixture"
hint = "python3 impulse-verification/tools/build_powergrid_fixture.py --case case1354pegase"

[prereqs.scip_clang]
kind = "optional_command"
command = "scip-clang"
description = "Sourcegraph C/C++ SCIP indexer (optional; enhances Phase 3 call graph)"
hint = "Download scip-clang release from github.com/sourcegraph/scip-clang/releases"

[prereqs.scip_java]
kind = "optional_command"
command = "scip-java"
description = "Sourcegraph Java/Kotlin/Scala SCIP indexer (optional; enhances Phase 3 call graph)"
hint = "cs install scip-java (or brew install coursier/formulas/coursier && cs install scip-java)"

[prereqs.rust_analyzer]
kind = "optional_command"
command = "rust-analyzer"
description = "rust-analyzer with native 'rust-analyzer scip' (optional; enhances Phase 3 call graph)"
hint = "rustup component add rust-analyzer"

[prereqs.scip_python]
kind = "optional_command"
command = "scip-python"
description = "Sourcegraph Python SCIP indexer (optional; enhances Phase 3 call graph)"
hint = "npm install -g @sourcegraph/scip-python"

